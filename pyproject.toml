[project]
name = "ghislieri-services"
version = "0.5.2"
description = "Services and Telegram bot for the students of Collegio Ghislieri"
readme = "README.md"
# python-telegram-bot 13.x imports `imghdr`, removed in Python 3.13.
requires-python = ">=3.11,<3.13"
dependencies = [
    "python-telegram-bot==13.14",
    "arrow>=1.3",
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "ics==0.7.2",
    "jinja2>=3.1",
    "pdf2image>=1.17",
    "pdfkit>=1.0",
    "requests>=2.31",
    "schedule>=1.2",
    "tinycss2>=1.2",
    # APScheduler 3.6 (via PTB 13) imports pkg_resources.
    "setuptools<81",
]

[tool.uv]
package = false
# Legacy pins: ics 0.7.2 breaks with TatSu>=5.12, PTB 13 needs urllib3<2.
constraint-dependencies = ["tatsu==5.11.3", "urllib3<2"]
